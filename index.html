<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>タスク管理アプリ</title>
</head>
<body>
    <h1>タスク管理アプリ</h1>

    <!-- タブ切り替えボタン -->
    <nav>
        <button id="tab-btn-now">今すぐ</button>
        <button id="tab-btn-tasklist">タスク一覧</button>
        <button id="tab-btn-calendar">カレンダー</button>
    </nav>

    <!-- 各画面の中身 -->
    <div id="tab-now" class="tab-content">
        <div>
            <label for="duration-select">今使える時間を選択してください：</label>
            <select name="durations" id="duration-select">
                <option value="">--1つ選択してください--</option>
                <option value="15min">15分</option>
                <option value="30min">30分</option>
                <option value="1hour">1時間</option>
                <option value="2hour+">2時間以上</option>
            </select>
        </div>

        <div>
            <label for="location-select">今いる場所を選択してください：</label>
            <select name="locations" id="location-select">
                <option value="">--1つ選択してください--</option>
                <option value="home">家</option>
                <option value="out">外</option>
            </select>
        </div>

        <button id="task-suggest-btn">タスク提案</button>
        <ul id="task-suggestion"></ul>
    </div>

    <div id="tab-tasklist" class="tab-content">
        <button id="add-task-btn">タスク追加</button>
        <ul id="task-list"></ul>
    </div>

    <div id="tab-calendar" class="tab-content">
    </div>


    <script src="script.js"></script>
</body>
</html>
